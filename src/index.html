<!--
  index.html
  Interface web pour la génération de labyrinthes
  Permet à l'utilisateur de saisir les dimensions et d'afficher la matrice générée
-->

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>-- Générateur de Labyrinthe --</title>
  <style>
    body {
      font-family: 'Poppins', 'Segoe UI', sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 48px;
      background: linear-gradient(180deg, #050616 0%, #0d1140 50%, #04030d 100%);
      color: #e6e8ff;
    }

    h1 {
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 24px;
      text-align: center;
    }

    .controls {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      margin-bottom: 28px;
      padding: 24px;
      border-radius: 16px;
      background: rgba(22, 27, 77, 0.7);
      backdrop-filter: blur(10px);
      box-shadow: 0 25px 45px rgba(3, 4, 25, 0.45);
    }

    .field {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-width: 120px;
    }

    .field label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
      color: #9aa4ff;
    }

    .field input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(132, 141, 255, 0.25);
      background: rgba(11, 14, 43, 0.85);
      color: #f1f3ff;
      font-size: 1rem;
      font-weight: 600;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
      transition: border 0.2s ease, transform 0.2s ease;
    }

    .field input:focus {
      outline: none;
      border-color: #6f7dff;
      transform: translateY(-1px);
    }

    button {
      align-self: center;
      background: linear-gradient(135deg, #6f7dff 0%, #2f3bff 100%);
      color: white;
      padding: 14px 32px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      box-shadow: 0 12px 24px rgba(63, 76, 255, 0.35);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 35px rgba(63, 76, 255, 0.45);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    #mazeContainer {
      width: 100%;
      max-width: 960px;
      padding: 24px;
      border-radius: 24px;
      background: rgba(10, 14, 48, 0.85);
      box-shadow: 0 30px 60px rgba(3, 5, 30, 0.55);
      backdrop-filter: blur(16px);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    #mazeContainer::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top left, rgba(111, 125, 255, 0.25), transparent 55%),
                  radial-gradient(circle at bottom right, rgba(56, 63, 175, 0.2), transparent 60%);
      z-index: 0;
      pointer-events: none;
    }

    #mazeCanvas {
      display: none;
      width: 100%;
      height: auto;
      image-rendering: pixelated;
      border-radius: 12px;
      z-index: 1;
    }

    #mazeDisplay {
      position: relative;
      z-index: 1;
      font-size: 1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(199, 204, 255, 0.75);
      text-align: center;
    }

    .info, .error {
      width: 100%;
      max-width: 720px;
      margin: 20px auto;
      padding: 14px 18px;
      border-radius: 10px;
      text-align: center;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .info {
      background: rgba(99, 116, 255, 0.15);
      color: #b7c0ff;
      border: 1px solid rgba(136, 150, 255, 0.4);
    }

    .error {
      background: rgba(244, 67, 54, 0.12);
      color: #ff8a80;
      border: 1px solid rgba(239, 83, 80, 0.4);
    }

    @media (max-width: 640px) {
      .controls {
        padding: 18px;
        border-radius: 12px;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <h1>Générateur de Labyrinthe</h1>
  
  <div class="controls">
    <div class="field">
      <label for="largeur">Largeur</label>
      <input type="number" id="largeur" value="24" min="3" max="50">
    </div>

    <div class="field">
      <label for="hauteur">Hauteur</label>
      <input type="number" id="hauteur" value="15" min="3" max="50">
    </div>

    <button id="generate-btn" onclick="genererLabyrinthe()">
      Générer
    </button>
  </div>
  
  <div id="info" class="info" style="display: none;"></div>
  <div id="error" class="error" style="display: none;"></div>
  
  <div id="mazeContainer">
    <canvas id="mazeCanvas"></canvas>
    <div id="mazeDisplay">Cliquez sur « Générer » pour créer un nouveau labyrinthe.</div>
  </div>

  <script>
    /**
     * Fonction principale de génération du labyrinthe
     * Envoie une requête GET à l'API et affiche le résultat
     */
    async function genererLabyrinthe() {
      const largeur = parseInt(document.getElementById('largeur').value);
      const hauteur = parseInt(document.getElementById('hauteur').value);
      const generateBtn = document.getElementById('generate-btn');
      const infoDiv = document.getElementById('info');
      const errorDiv = document.getElementById('error');
      const mazeDisplay = document.getElementById('mazeDisplay');
      const mazeCanvas = document.getElementById('mazeCanvas');
      
      // Validation des dimensions
      if (largeur < 3 || largeur > 50 || hauteur < 3 || hauteur > 50) {
        errorDiv.textContent = 'Veuillez entrer des valeurs entre 3 et 50';
        errorDiv.style.display = 'block';
        infoDiv.style.display = 'none';
        return;
      }
      
      // État de chargement
      generateBtn.disabled = true;
      generateBtn.textContent = 'Génération en cours...';
      infoDiv.style.display = 'block';
      infoDiv.textContent = 'Génération du labyrinthe...';
      errorDiv.style.display = 'none';
  mazeCanvas.style.display = 'none';
  mazeDisplay.style.display = 'block';
  mazeDisplay.textContent = 'Construction du labyrinthe en cours...';
      
      try {
        // Appel API
        const response = await fetch(`/api/generate?largeur=${largeur}&hauteur=${hauteur}`);
        
        if (!response.ok) {
          throw new Error(`Erreur HTTP: ${response.status}`);
        }
        
        const data = await response.json();
        
        // Affichage du labyrinthe - utilise la grille si disponible, sinon la matrice
        if (data.grille) {
          afficherGrille(data.grille);
        } else {
          afficherMatrice(data.labyrinthe, data.largeur, data.hauteur);
        }
        
        // Message d'info avec détails sur l'imperfection
        let infoMessage = `Labyrinthe généré: ${largeur}×${hauteur} (${data.nb_lignes} lignes)`;
        if (data.niveau_imperfection) {
          infoMessage += ` - Imperfection: ${(data.niveau_imperfection * 100).toFixed(0)}%`;
        }
        if (data.tunnels_horizontaux && data.tunnels_verticaux) {
          infoMessage += ` - Tunnels: ${data.tunnels_horizontaux.length}H + ${data.tunnels_verticaux.length}V`;
        }
        infoDiv.textContent = infoMessage;
        
      } catch (error) {
        errorDiv.textContent = `Erreur: ${error.message}`;
        errorDiv.style.display = 'block';
        infoDiv.style.display = 'none';
        mazeCanvas.style.display = 'none';
        mazeDisplay.style.display = 'block';
        mazeDisplay.textContent = 'Erreur lors de la génération';
        console.error('Erreur:', error);
      } finally {
        // Réinitialisation du bouton
        generateBtn.disabled = false;
        generateBtn.textContent = 'Générer Labyrinthe';
      }
    }
    
    /**
     * Affiche la grille de pixels directement (générée par Python avec tunnels)
     * @param {Array<Array<number>>} grille - Grille de pixels (0 = couloir, 1 = mur)
     */
    function afficherGrille(grille) {
      const mazeCanvas = document.getElementById('mazeCanvas');
      const mazeDisplay = document.getElementById('mazeDisplay');

      if (!Array.isArray(grille) || grille.length === 0) {
        mazeCanvas.style.display = 'none';
        mazeDisplay.style.display = 'block';
        mazeDisplay.textContent = 'Grille vide';
        return;
      }

      const rows = grille.length;
      const cols = grille[0].length;

      const ctx = mazeCanvas.getContext('2d');
      const maxWidth = 880;
      const maxHeight = 560;
      let tileSize = Math.floor(Math.min(maxWidth / cols, maxHeight / rows));
      tileSize = Math.max(tileSize, 4);

      mazeCanvas.width = cols * tileSize;
      mazeCanvas.height = rows * tileSize;

      ctx.fillStyle = '#060821';
      ctx.fillRect(0, 0, mazeCanvas.width, mazeCanvas.height);

  // Inversion des couleurs : murs <-> couloirs
  const wallColor = '#171c85'; // anciennement couleur des couloirs
  const pathColor = '#040404'; // anciennement couleur des murs

      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          ctx.fillStyle = grille[row][col] === 1 ? wallColor : pathColor;
          ctx.fillRect(col * tileSize, row * tileSize, tileSize, tileSize);
        }
      }

      mazeCanvas.style.display = 'block';
      mazeDisplay.style.display = 'none';
    }

    /**
     * Affiche la matrice du labyrinthe version initiale (true (1)/false (0) )
     * @param {Array<Array<boolean>>} labyrinthe - Matrice du labyrinthe
     */
    function afficherMatrice(labyrinthe, largeur, hauteur) {
      const mazeCanvas = document.getElementById('mazeCanvas');
      const mazeDisplay = document.getElementById('mazeDisplay');

      if (!Array.isArray(labyrinthe) || labyrinthe.length === 0) {
        mazeCanvas.style.display = 'none';
        mazeDisplay.style.display = 'block';
        mazeDisplay.textContent = 'Labyrinthe vide';
        return;
      }

      const rows = hauteur * 2 + 1;
      const cols = largeur * 2 + 1;
      const grid = Array.from({ length: rows }, () => Array(cols).fill(1));

      for (let y = 0; y < hauteur; y++) {
        for (let x = 0; x < largeur; x++) {
          const cellRow = 2 * y + 1;
          const cellCol = 2 * x + 1;
          grid[cellRow][cellCol] = 0;

          if (x < largeur - 1 && labyrinthe[2 * y] && labyrinthe[2 * y][x] === false) {
            grid[cellRow][cellCol + 1] = 0;
          }

          if (y < hauteur - 1 && labyrinthe[2 * y + 1] && labyrinthe[2 * y + 1][x] === false) {
            grid[cellRow + 1][cellCol] = 0;
          }
        }
      }

      const ctx = mazeCanvas.getContext('2d');
      const maxWidth = 880;
      const maxHeight = 560;
      let tileSize = Math.floor(Math.min(maxWidth / cols, maxHeight / rows));
      tileSize = Math.max(tileSize, 4);

      mazeCanvas.width = cols * tileSize;
      mazeCanvas.height = rows * tileSize;

      ctx.fillStyle = '#060821';
      ctx.fillRect(0, 0, mazeCanvas.width, mazeCanvas.height);

  // Inversion des couleurs : murs <-> couloirs
  const wallColor = '#171c85'; // anciennement couleur des couloirs
  const pathColor = '#040404'; // anciennement couleur des murs

      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          ctx.fillStyle = grid[row][col] === 1 ? wallColor : pathColor;
          ctx.fillRect(col * tileSize, row * tileSize, tileSize, tileSize);
        }
      }

      mazeCanvas.style.display = 'block';
      mazeDisplay.style.display = 'none';
    }
    
    // Gestion de l'événement "Enter" pour les champs de saisie
    document.getElementById('largeur').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') genererLabyrinthe();
    });
    
    document.getElementById('hauteur').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') genererLabyrinthe();
    });
  </script>
</body>
</html>
