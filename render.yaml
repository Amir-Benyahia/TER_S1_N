# Render deployment configuration for Pacman Lab

services:
  # Web Service (Node.js + Python)
  - type: web
    name: pacman-lab
    env: node
    region: frankfurt  # Change to your preferred region
    plan: free
    buildCommand: cd .. && npm install && pip install -r requirements.txt
    startCommand: cd .. && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false  # Set this in Render Dashboard
      - key: PYTHON_PATH
        value: python3
      - key: PORT
        value: 3000
      - key: CORS_ORIGIN
        value: "*"
    healthCheckPath: /api/health
    autoDeploy: true

# MongoDB Database
# Set up MongoDB Atlas (free tier) separately and add connection string to MONGODB_URI env var
# Connection string format:
# mongodb+srv://<username>:<password>@cluster0.xxxxx.mongodb.net/pacman-lab?retryWrites=true&w=majority

